name: CI/CD for koselighar-frontend (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, hostinger]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load NVM and Node.js
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 24
          nvm use 24
          node -v
          npm -v

      - name: Install dependencies
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 24
          npm ci --legacy-peer-deps

      - name: Remove ALL existing env files
        shell: bash
        run: |
          rm -f .env*
          echo "✓ Removed ALL .env files"

      - name: Create environment file
        shell: bash
        run: |
          cat > .env << 'EOF'
          NEXT_PUBLIC_API_URL=https://koseligharapi.deeyosoft.com
          NEXT_PUBLIC_ROOT_DOMAIN=smartptrm.com
          EOF
          echo "✓ Created .env"

      - name: Build project
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 24
          npm run build

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist directory not found!"
            exit 1
          fi
          echo "✓ Production build verified"

      - name: Deploy to production directory
        shell: bash
        run: |
          DEPLOY_DIR=/home/beingonam/koselighar-frontend-dev
          BUILD_SOURCE=$(pwd)

          echo "Deploying to: $DEPLOY_DIR"
          mkdir -p $DEPLOY_DIR
          rsync -a --delete "$BUILD_SOURCE"/ "$DEPLOY_DIR"/
          chmod -R 755 $DEPLOY_DIR
          echo "✓ Deployment complete"

      - name: Copy env to deploy directory
        shell: bash
        run: |
          cp .env /home/beingonam/koselighar-frontend-dev/.env
          echo "✓ .env copied to deployment directory"

      - name: Start/Reload Next.js with PM2
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 24

          DEPLOY_DIR=/home/beingonam/koselighar-frontend-dev
          cd "$DEPLOY_DIR"

          # Install production deps in deploy dir
          npm ci --legacy-peer-deps --omit=dev || npm install --legacy-peer-deps --omit=dev

          APP_NAME="koselighar-frontend-dev"

          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
            echo "Reloading existing PM2 process..."
            pm2 reload "$APP_NAME" --update-env
          else
            echo "Starting new PM2 process..."
            pm2 start npm --name "$APP_NAME" -- start -- -p 3001
          fi

          # Wait for app to come online
          MAX_ATTEMPTS=15
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(pm2 jlist | jq -r ".[] | select(.name==\"$APP_NAME\") | .pm2_env.status" | head -n1)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Status = $STATUS"
            if [ "$STATUS" = "online" ]; then
              echo "✓ Frontend deployment successful"
              pm2 save --force
              break
            fi
          done

          if [ "$STATUS" != "online" ]; then
            echo "❌ Timeout: App did not come online"
            pm2 logs "$APP_NAME" --lines 50 --nostream || true
            exit 1
          fi

      - name: Reload nginx
        shell: bash
        run: |
          sudo systemctl reload nginx
          echo "✓ Nginx reloaded"

      - name: Health Check
        shell: bash
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://koselighar.smartptrm.com)
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
            echo "✓ Frontend site is reachable (HTTP $STATUS)"
          else
            echo "✗ Frontend site not reachable (HTTP $STATUS)"
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        shell: bash
        run: |
          echo "=== Final PM2 Status ==="
          pm2 list

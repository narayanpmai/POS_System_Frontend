name: CI/CD for koselighar-frontend (dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted, hostinger]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load NVM and Node.js
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm install 24
          nvm use 24
          node -v
          npm -v

      - name: Install dependencies
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 24
          npm ci --legacy-peer-deps

      - name: Remove ALL existing env files
        shell: bash
        run: |
          rm -f .env*
          echo "✓ Removed ALL .env files"

      - name: Create environment file
        shell: bash
        run: |
          cat > .env << 'EOF'
          NEXT_PUBLIC_API_URL=https://koseligharapi.deeyosoft.com
          NEXT_PUBLIC_ROOT_DOMAIN=smartptrm.com
          EOF
          echo "✓ Created .env"

      - name: Build project
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 24
          npm run build

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ ERROR: dist directory not found!"
            exit 1
          fi
          echo "✓ Production build verified"

      - name: Deploy to production directory
        shell: bash
        run: |
          DEPLOY_DIR=/home/beingonam/koselighar-frontend-dev
          BUILD_SOURCE=$(pwd)

          echo "Deploying to: $DEPLOY_DIR"
          mkdir -p $DEPLOY_DIR
          rsync -a --delete "$BUILD_SOURCE"/ "$DEPLOY_DIR"/
          chmod -R 755 $DEPLOY_DIR
          echo "✓ Deployment complete"

      - name: Copy env to deploy directory
        shell: bash
        run: |
          cp .env /home/beingonam/koselighar-frontend-dev/.env
          echo "✓ .env copied to deployment directory"

      - name: Start/Reload Next.js with PM2
        shell: bash
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 24

          DEPLOY_DIR=/home/beingonam/koselighar-frontend-dev
          cd "$DEPLOY_DIR"

          # Install production deps in deploy dir
          npm ci --legacy-peer-deps --omit=dev || npm install --legacy-peer-deps --omit=dev

          APP_NAME="koselighar-frontend-dev"

          if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
            echo "Reloading existing PM2 process..."
            pm2 stop "$APP_NAME" || true
            pm2 delete "$APP_NAME" || true
          fi

          echo "Starting Next.js server on port 3001..."
          PORT=3001 pm2 start npm --name "$APP_NAME" -- run start -- -p 3001

          # Wait for app to come online
          MAX_ATTEMPTS=20
          ATTEMPT=0
          STATUS=""
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 3
            ATTEMPT=$((ATTEMPT + 1))
            STATUS=$(pm2 jlist | jq -r ".[] | select(.name==\"$APP_NAME\") | .pm2_env.status" | head -n1)
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Status = $STATUS"
            if [ "$STATUS" = "online" ]; then
              echo "✓ Frontend deployment successful"
              pm2 save --force
              break
            fi
          done

          if [ "$STATUS" != "online" ]; then
            echo "❌ Timeout: App did not come online"
            pm2 logs "$APP_NAME" --lines 80 --nostream || true
            exit 1
          fi

      - name: Update nginx proxy config for koselighar.smartptrm.com
        shell: bash
        run: |
          # Find the nginx config file for this site
          NGINX_CONF=""
          for f in /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
            if [ -f "$f" ] && grep -q "koselighar.smartptrm.com" "$f" 2>/dev/null; then
              NGINX_CONF="$f"
              break
            fi
          done

          if [ -z "$NGINX_CONF" ]; then
            echo "⚠ No existing nginx config found for koselighar.smartptrm.com"
            echo "Creating new config at /etc/nginx/sites-enabled/koselighar-frontend"
            NGINX_CONF="/etc/nginx/sites-enabled/koselighar-frontend"
          else
            echo "Found nginx config: $NGINX_CONF"
            echo "--- Current config ---"
            cat "$NGINX_CONF"
          fi

          # Only update if not already proxying to 3001
          if grep -q "proxy_pass.*3001" "$NGINX_CONF" 2>/dev/null; then
            echo "✓ Nginx already configured to proxy to port 3001 — no changes needed"
          else
            echo "Updating nginx config to proxy to port 3001..."
            sudo tee "$NGINX_CONF" > /dev/null << 'NGINXEOF'
          server {
              listen 80;
              listen [::]:80;
              server_name koselighar.smartptrm.com;
              return 301 https://$host$request_uri;
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name koselighar.smartptrm.com;

              ssl_certificate /etc/letsencrypt/live/koselighar.smartptrm.com/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/koselighar.smartptrm.com/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

              location / {
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
                  proxy_read_timeout 120s;
              }
          }
          NGINXEOF
            echo "✓ Nginx config updated"
          fi

          sudo nginx -t && echo "✓ Nginx config valid"

      - name: Reload nginx
        shell: bash
        run: |
          sudo systemctl reload nginx
          echo "✓ Nginx reloaded"

      - name: Health Check
        shell: bash
        run: |
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://koselighar.smartptrm.com)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 301 ] || [ "$STATUS" -eq 302 ]; then
            echo "✓ Frontend site is reachable (HTTP $STATUS)"
          else
            echo "✗ Frontend site not reachable (HTTP $STATUS)"
            # Show PM2 logs for debugging
            pm2 logs koselighar-frontend-dev --lines 30 --nostream || true
            exit 1
          fi

      - name: Deployment Summary
        if: always()
        shell: bash
        run: |
          echo "=== Final PM2 Status ==="
          pm2 list
          echo ""
          echo "=== Nginx Status ==="
          sudo systemctl status nginx --no-pager | head -20

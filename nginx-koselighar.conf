# Nginx configuration for koselighar.smartptrm.com
# Place this in /etc/nginx/sites-available/koselighar-frontend
# Then symlink: ln -s /etc/nginx/sites-available/koselighar-frontend /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name koselighar.smartptrm.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name koselighar.smartptrm.com;

    # SSL - update paths to your actual cert files
    ssl_certificate /etc/letsencrypt/live/koselighar.smartptrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koselighar.smartptrm.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy all requests to the Next.js server running on port 3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Serve Next.js static assets directly for better performance
    location /_next/static/ {
        alias /home/beingonam/koselighar-frontend-dev/dist/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
